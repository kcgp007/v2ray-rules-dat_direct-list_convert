name: Update Proxy Rules # 工作流名称

on:
  schedule:
    - cron: '0 0 * * *' # 定时任务：每天 UTC 0点（北京时间早8点）运行
  workflow_dispatch:      # 允许在 GitHub Actions 页面点击按钮手动触发运行

jobs:
  build-and-run:
    runs-on: ubuntu-latest # 使用最新的 Ubuntu 虚拟环境
    permissions:
      contents: write      # 赋予机器人提交代码到仓库的权限
      actions: write       # 赋予机器人删除 Actions 运行记录的权限

    steps:
      # 1. 拉取本仓库的代码
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. 配置 Rust 编译环境
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # 3. 配置 Rust 缓存，避免每次都重新下载和编译依赖库，提速显著
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2

      # 3.5 代码格式检查
      - name: Format check
        run: cargo fmt --check

      # 3.6 静态分析检查
      - name: Clippy lint
        run: cargo clippy -- -D warnings

      # 4. 运行 Rust 程序开始转换
      - name: Build and Run
        run: cargo run

      # 5. 将生成的订阅文件发布到 GitHub Release（tag: latest），保持订阅 URL 稳定
      - name: Publish to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            # Release 已存在 -> 原地覆盖（clobber）两个资产，不删除 tag，避免 orphaned-draft 竞态
            echo "Release 'latest' 已存在，覆盖资产"
            gh release upload latest direct.txt proxy.txt --clobber
          else
            # Release 不存在 -> 创建 tag + release 并上传两个资产
            echo "创建 Release 'latest'"
            gh release create latest direct.txt proxy.txt \
              --target "$GITHUB_SHA" \
              --title "Direct/Proxy subscription lists (daily)" \
              --notes "每日自动发布。稳定订阅地址：
              https://github.com/$GITHUB_REPOSITORY/releases/download/latest/direct.txt
              https://github.com/$GITHUB_REPOSITORY/releases/download/latest/proxy.txt"
          fi

          # 保持该 Release 为 "Latest" 标记（防御性）
          gh release edit latest --latest --title "Direct/Proxy subscription lists (daily)" || true

      # 6. 使用 GitHub 官方 CLI 清理历史运行记录，只保留最近 7 次
      - name: Delete old workflow runs
        run: |
          # 逻辑说明：
          # gh run list: 列出运行记录
          # --limit 100: 获取最近100条
          # -q '.[7:].databaseId': 使用 jq 过滤语法，跳过前 7 条记录，获取之后所有记录的 ID
          # xargs: 将获取到的 ID 传递给删除命令
          gh run list --workflow update.yml --limit 100 --json databaseId -q '.[7:].databaseId' | xargs -I {} gh run delete {}
        env:
          GITHUB_TOKEN: ${{ github.token }} # 传递必要的验证凭据
